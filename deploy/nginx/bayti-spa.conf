# Shared by the three front ends (installed as /etc/nginx/snippets/bayti-spa.conf).
# Single-page apps: any path that isn't a file falls back to index.html.
# (Nginx drops outer add_header lines inside a location that has its own, so
# each location lists its headers in full.)

index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Vite puts a content hash in every asset name, so these never change.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location / {
    # index.html is re-checked on every visit so a deploy shows up immediately
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri $uri/ /index.html;
}
